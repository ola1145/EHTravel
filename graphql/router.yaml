# Apollo Router config for EHTravel.
# The Duffel token is read from the process env ($env.DUFFEL_API_TOKEN) by the connector;
# it is never sent to the browser. Run: npm run router  (rover dev), or the router binary.
supergraph:
  listen: 0.0.0.0:4000
  path: /graphql

health_check:
  enabled: true
  path: /health

# Allow the static front end (npm run dev on :3000) to call the router from the browser.
cors:
  origins:
    - http://localhost:3000
    - http://localhost:8080
    - https://ehtravel.org
  allow_credentials: false
  allow_headers:
    - content-type

# Surface connector HTTP errors during development.
include_subgraph_errors:
  all: true
