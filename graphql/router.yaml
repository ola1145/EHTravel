# Apollo Router config for EHTravel.
# The Duffel token is read from the process env ($env.DUFFEL_API_TOKEN) by the connector;
# it is never sent to the browser. Run: npm run router  (rover dev), or the router binary.
# Listen on Railway's injected $PORT in the cloud; default to 4000 for local dev.
supergraph:
  listen: 0.0.0.0:${env.PORT:-4000}
  path: /graphql

health_check:
  enabled: true
  path: /health

# Public GraphQL gateway over Duffel — no cookies/credentials, so any browser origin
# may call it (this lets the deployed front end + local dev both reach the router).
# Lock this down to specific origins later if you don't want a public API.
cors:
  allow_any_origin: true
  allow_headers:
    - content-type

# Surface connector HTTP errors during development.
include_subgraph_errors:
  all: true
