  EXECUTION
}

type Mutation
  @join__type(graph: DUFFEL)
{
  """
  Create a flight booking (order) for a selected offer. Requires a live Duffel token.
  """
  createFlightOrder(input: FlightOrderInput!): FlightOrder @join__directive(graphs: [DUFFEL], name: "connect", args: {source: "duffel", http: {POST: "/air/orders", body: "$({\n  data: {\n    type: $(\"instant\"),\n    selected_offers: [$args.input.offerId],\n    passengers: $args.input.passengers,\n    payments: [{\n      type: $(\"balance\"),\n      amount: $args.input.amount,\n      currency: $args.input.currency\n    }]\n  }\n})"}, selection: "$.data {\n  id\n  bookingReference: booking_reference\n  totalAmount: total_amount\n  totalCurrency: total_currency\n  createdAt: created_at\n}"})

  """Create a hotel booking from a previously created quote."""
  createStayBooking(input: StayBookingInput!): StayBooking @join__directive(graphs: [DUFFEL], name: "connect", args: {source: "duffel", http: {POST: "/stays/bookings", body: "$({\n  data: {\n    quote_id: $args.input.quoteId,\n    email: $args.input.email,\n    phone_number: $args.input.phoneNumber,\n    guests: $args.input.guests,\n    accommodation_special_requests: $args.input.specialRequests\n  }\n})"}, selection: "$.data {\n  id\n  reference: booking_reference\n  status\n  totalAmount: total_amount\n  totalCurrency: total_currency\n}"})
}

