type Query
  @join__type(graph: CARS)
  @join__type(graph: DUFFEL)
{
  """
  Search rental cars. MOCK — see file header; the browser uses a client-side fallback.
  """
  searchCars(input: CarSearchInput!): [CarResult!]! @join__field(graph: CARS) @join__directive(graphs: [CARS], name: "connect", args: {source: "cars_mock", http: {GET: "/v1/search", queryParams: "pickup: $args.input.pickupLocation\ndropoff: $args.input.dropoffLocation\npickup_date: $args.input.pickupDate\ndropoff_date: $args.input.dropoffDate"}, selection: "$.results {\n  id\n  vendor: vendor.name\n  vehicleClass: vehicle.class\n  vehicleName: vehicle.name\n  transmission: vehicle.transmission\n  seats: vehicle.seats\n  bags: vehicle.bags\n  imageUrl: vehicle.image_url\n  totalAmount: price.total\n  currency: price.currency\n  pickupLocation: pickup.name\n  dropoffLocation: dropoff.name\n}"})

  """
  Search for flight offers. Creates a Duffel offer request and returns the offers.
  """
  searchFlights(input: FlightSearchInput!): [FlightOffer!]! @join__field(graph: DUFFEL) @join__directive(graphs: [DUFFEL], name: "connect", args: {source: "duffel", http: {POST: "/air/offer_requests", queryParams: "return_offers: $(true)", body: "$({\n  data: {\n    slices: $args.input.slices->map({\n      origin: @.origin,\n      destination: @.destination,\n      departure_date: @.departureDate\n    }),\n    passengers: $args.input.passengers,\n    cabin_class: $args.input.cabinClass\n  }\n})"}, selection: "$.data.offers {\n  id\n  totalAmount: total_amount\n  totalCurrency: total_currency\n  taxAmount: tax_amount\n  owner: owner {\n    name\n    iataCode: iata_code\n    logoUrl: logo_symbol_url\n  }\n  slices: slices {\n    duration\n    origin: origin { iataCode: iata_code cityName: city_name name }\n    destination: destination { iataCode: iata_code cityName: city_name name }\n    segments: segments {\n      departingAt: departing_at\n      arrivingAt: arriving_at\n      duration\n      operatingCarrier: operating_carrier { name iataCode: iata_code }\n      aircraft: aircraft { name }\n      origin: origin { iataCode: iata_code }\n      destination: destination { iataCode: iata_code }\n    }\n  }\n}"})

  """Fetch a single flight offer by id (refreshes price / availability)."""
  flightOffer(id: ID!): FlightOffer @join__field(graph: DUFFEL) @join__directive(graphs: [DUFFEL], name: "connect", args: {source: "duffel", http: {GET: "/air/offers/{$args.id}"}, selection: "$.data {\n  id\n  totalAmount: total_amount\n  totalCurrency: total_currency\n  taxAmount: tax_amount\n  owner: owner { name iataCode: iata_code logoUrl: logo_symbol_url }\n  slices: slices {\n    duration\n    origin: origin { iataCode: iata_code cityName: city_name name }\n    destination: destination { iataCode: iata_code cityName: city_name name }\n    segments: segments {\n      departingAt: departing_at\n      arrivingAt: arriving_at\n      duration\n      operatingCarrier: operating_carrier { name iataCode: iata_code }\n      aircraft: aircraft { name }\n      origin: origin { iataCode: iata_code }\n      destination: destination { iataCode: iata_code }\n    }\n  }\n}"})

  """
  Search for accommodation (hotels). Returns a list of search results with the cheapest rate.
  """
  searchStays(input: StaySearchInput!): [StayResult!]! @join__field(graph: DUFFEL) @join__directive(graphs: [DUFFEL], name: "connect", args: {source: "duffel", http: {POST: "/stays/search", body: "$({\n  data: {\n    check_in_date: $args.input.checkInDate,\n    check_out_date: $args.input.checkOutDate,\n    rooms: $args.input.rooms,\n    guests: $args.input.guests,\n    location: {\n      radius: $args.input.location.radius,\n      geographic_coordinates: {\n        latitude: $args.input.location.latitude,\n        longitude: $args.input.location.longitude\n      }\n    }\n  }\n})"}, selection: "$.data.results {\n  id\n  cheapestRateTotalAmount: cheapest_rate_total_amount\n  cheapestRateCurrency: cheapest_rate_currency\n  accommodation: accommodation {\n    id\n    name\n    rating\n    reviewScore: review_score\n    photos: photos { url }\n    location: location {\n      address: address {\n        lineOne: line_one\n        city: city_name\n        countryCode: country_code\n        postalCode: postal_code\n      }\n    }\n  }\n}"})
}

